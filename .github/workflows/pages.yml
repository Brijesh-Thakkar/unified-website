name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # 0.22+ rejects `[markdown.highlighting] enabled` in config.toml
  ZOLA_VERSION: 0.21.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Zola
        run: |
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin/

      - name: Generate version file
        run: |
          mkdir -p ./static/data
          TZ=UTC git show -s --date=iso-local --format='%h %cd' HEAD > ./static/data/version

      - name: Build
        run: zola build --base-url "${{ steps.pages.outputs.base_url }}/"

      # Templates use relative paths, but markdown content has root-absolute
      # links like /docs/foo/ that break under a project-page subpath.
      - name: Prefix root-absolute links with the Pages base path
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$BASE_PATH" ]; then
            find public -name '*.html' -print0 | xargs -0 sed -i -E \
              "s#(href|src)=\"/([^/\"])#\1=\"${BASE_PATH}/\2#g"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
